# Router zgłoszeń: API Python, Ollama i skrzynka testowa Mailpit.

name: message-router

services:
  api:
    build: ./api
    ports:
      - "8000:8000"
    environment:
      OLLAMA_BASE_URL: http://ollama:11434/v1
      OLLAMA_HOST_URL: http://ollama:11434
      OLLAMA_MODEL: qwen2.5:3b
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_FROM: message-router@example.com
    depends_on:
      ollama:
        condition: service_healthy
      mailpit:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen("http://127.0.0.1:8000/api/v1/health", timeout=5)
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 900s

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"
    environment:
      MP_MAX_MESSAGES: "500"
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      OLLAMA_KEEP_ALIVE: 24h
      OLLAMA_CONTEXT_LENGTH: "8192"
      OLLAMA_NUM_PARALLEL: "1"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 20s

volumes:
  ollama_data:
